name: Checks

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  source-checks:
    name: Source checks (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, zip
          tools: composer

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: |
          composer install --no-interaction --prefer-dist
          npm ci --no-audit --no-fund

      - name: Run complete source gate
        run: composer check

  php74-syntax:
    name: Production syntax (PHP 7.4)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up declared minimum PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '7.4'

      - name: Check every shipped PHP file
        run: |
          php -l zen-by-mpty.php
          php -l includes/class-mpty-zen.php
          php -l uninstall.php

  production-artifact:
    name: Build and validate WordPress.org artifact
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.2'
          extensions: zip

      - name: Build exact production artifact
        run: php scripts/build-production.php build --source="$GITHUB_WORKSPACE" --output="$GITHUB_WORKSPACE/build"

      - name: Revalidate final ZIP
        run: php scripts/build-production.php validate --source="$GITHUB_WORKSPACE" --zip="$GITHUB_WORKSPACE/build/zen-by-mpty-0.6.0.zip"

      - name: Show production contents and verify checksum
        run: |
          find build/zen-by-mpty -type f -print | sort
          cd build
          sha256sum --check zen-by-mpty-0.6.0.zip.sha256

      - name: Preserve validated artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zen-wordpress-org-artifact
          path: |
            build/zen-by-mpty
            build/zen-by-mpty-0.6.0.zip
            build/zen-by-mpty-0.6.0.zip.sha256
          if-no-files-found: error
          retention-days: 7

  plugin-check:
    name: WordPress Plugin Check
    needs: production-artifact
    runs-on: ubuntu-latest
    steps:
      - name: Check out validator source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.2'
          extensions: zip

      - name: Retrieve validated artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: zen-wordpress-org-artifact
          path: build

      - name: Verify artifact after CI handoff
        run: |
          php scripts/build-production.php validate --source="$GITHUB_WORKSPACE" --zip="$GITHUB_WORKSPACE/build/zen-by-mpty-0.6.0.zip"
          cd build
          sha256sum --check zen-by-mpty-0.6.0.zip.sha256

      - name: Run Plugin Check against production files
        uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1
        with:
          build-dir: ${{ github.workspace }}/build/zen-by-mpty

  compatibility:
    name: Compatibility (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: WordPress 6.4 / PHP 7.4
            config: .wp-env.wp64.json
          - name: Current WordPress / PHP 8.4
            config: .wp-env.latest.json
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked WordPress environment
        run: npm ci --no-audit --no-fund

      - name: Run disposable activation and settings smoke test
        shell: pwsh
        run: ./scripts/compatibility-test.ps1 -Config ${{ matrix.config }}
